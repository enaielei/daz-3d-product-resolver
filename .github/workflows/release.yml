name: Windows preview release
on:
  push:
    tags: ['v*-preview.*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release
          path: dist/release
      - name: Check release tag matches application version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          case "$TAG" in "v$VERSION"-preview.*) ;; *) echo 'Tag/version mismatch'; exit 1 ;; esac
          cd dist/release
          sha256sum --check SHA256SUMS.txt
      - name: Publish tested preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --prerelease --title "$TAG — Windows preview" --notes-file docs/release-notes.md dist/release/*
