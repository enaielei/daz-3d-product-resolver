name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -p no:pytest-qt --ignore=tests/test_ui.py
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv sync --locked --all-extras
      - run: uv run pytest tests/test_ui.py
      - run: uv run python packaging/build_windows.py
      - shell: pwsh
        run: ./packaging/prepare_inno.ps1
      - run: uv run python packaging/build_release.py --iscc work/tools/inno/ISCC.exe
      - shell: pwsh
        run: ./packaging/smoke_installer.ps1 -Installer dist/release/Daz3DProductResolver-0.1.0-windows-x64-setup.exe
      - shell: pwsh
        run: |
          $process = Start-Process dist/Daz3DProductResolver/Daz3DProductResolver.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop
          path: dist/Daz3DProductResolver/
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release
          path: dist/release/
